ation.","Gib deinen Namen, deine E-Mail und den Code aus deiner Bestätigung ein."],"Pladsen er desværre taget. Du står stadig på ventelisten.":["Unfortunately the spot was taken. You are still on the waitlist.","Der Platz wurde leider vergeben. Du stehst weiterhin auf der Warteliste."],"Åbn en camp og hjælp kunden i den rolle, de har brug for.":["Open a camp and help the customer in the role they need.","Öffne ein Camp und hilf dem Kunden in der Rolle, die er braucht."],"findes ikke. Opret instruktøren først, og vælg filen igen.":["doesn’t exist. Create the instructor first and choose the file again.","existiert nicht. Lege zuerst den Skilehrer an und wähle die Datei erneut."],"Skabelonen er hentet. Ret eksemplerne, og vælg filen igen.":["The template was downloaded. Edit the examples and choose the file again.","Die Vorlage wurde heruntergeladen. Passe die Beispiele an und wähle die Datei erneut."],"Meld dig til en workshop under Workshops, så vises den her.":["Sign up for a workshop under Workshops and it will appear here.","Melde dich unter Workshops für einen Workshop an, dann erscheint er hier."],"· samme kode til alle deltagere. Send den med bekræftelsen.":["· same code for all participants. Send it with the confirmation.","· derselbe Code für alle Teilnehmer. Sende ihn mit der Bestätigung."],"Skru aldrig selv på indstillingen. Det skal en fagmand gøre.":["Never adjust the setting yourself. A professional must do it.","Verstelle die Einstellung niemals selbst. Das muss ein Fachmann tun."],". Send den nye kode til dem, der ikke har oprettet sig endnu.":[". Send the new code to those who haven’t signed up yet.",". Sende den neuen Code an alle, die sich noch nicht registriert haben."],"er logget ud på alle enheder. Der er sendt en ny loginkode til":["has been logged out on all devices. A new login code was sent to","wurde auf allen Geräten abgemeldet. Ein neuer Login-Code wurde gesendet an"],"Der findes allerede en konto med den e-mail. Log ind i stedet.":["An account with that email already exists. Log in instead.","Mit dieser E-Mail existiert bereits ein Konto. Melde dich stattdessen an."],"Dem ændrer du under “Instruktører” og “Butikker” i oversigten.":["You change them under “Instructors” and “Shops” in the overview.","Diese änderst du in der Übersicht unter „Skilehrer“ und „Shops“."],"Skriv din e-mail. Vi sender dig en kode, så vi ved, det er dig.":["Enter your email. We’ll send you a code so we know it’s you.","Gib deine E-Mail ein. Wir senden dir einen Code, damit wir wissen, dass du es bist."],"Holdet har ikke plads til hele gruppen. I er sat på venteliste.":["The group doesn’t have room for your whole party. You’ve been put on the waitlist.","Die Gruppe hat nicht Platz für alle. Ihr wurdet auf die Warteliste gesetzt."],"Dit navn kan ikke ændres her. Er der en fejl, så kontakt campen:":["Your name can’t be changed here. If there’s a mistake, contact the camp:","Dein Name kann hier nicht geändert werden. Bei einem Fehler wende dich an das Camp:"],"Samme kode til alle deltagere. Ændr den under “Camp og udseende”.":["Same code for all participants. Change it under “Camp and appearance”.","Derselbe Code für alle Teilnehmer. Ändere ihn unter „Camp und Aussehen“."],"Tallet er støvlens længde i millimeter. Står der 29,5, er det 295 mm.":["The number is the boot length in millimeters. If it says 29.5, that is 295 mm.","Die Zahl ist die Schuhlänge in Millimetern. Steht dort 29,5, sind es 295 mm."],"Så skriv det, som skibutikken har indstillet den til, eller spørg dem.":["Then enter what the ski shop set it to, or ask them.","Dann gib an, was der Skishop eingestellt hat, oder frage dort nach."],"Ændringen vises med det samme for deltageren og logges i support-loggen.":["The change is shown to the participant immediately and logged in the support log.","Die Änderung wird dem Teilnehmer sofort angezeigt und im Support-Protokoll erfasst."],"Butikken kan kun oprette og rette ski under egne mærker. Fx: Atomic, Völkl.":["The shop can only create and edit skis under its own brands. E.g.: Atomic, Völkl.","Der Shop kann nur Ski unter eigenen Marken anlegen und bearbeiten. Z. B.: Atomic, Völkl."],"Skiene og holdene bruger disse niveauer. Ret navnet, og det rettes alle steder.":["Skis and groups use these levels. Edit a name and it changes everywhere.","Ski und Gruppen verwenden diese Niveaus. Ändere einen Namen, und er ändert sich überall."],"Excel. Kolonner: Navn, Niveau, Dag, Tid, Varighed, Max, Instruktør, Anbefalet ski":["Excel. Columns: Name, Level, Day, Time, Duration, Max, Instructor, Recommended ski","Excel. Spalten: Name, Niveau, Tag, Zeit, Dauer, Max, Skilehrer, Empfohlener Ski"],"Kan du ikke finde det, så spørg en i skibutikken. De kan måle støvlen på få sekunder.":["Can’t find it? Ask someone in the ski shop. They can measure the boot in seconds.","Kannst du es nicht finden, frage im Skishop nach. Dort wird der Schuh in Sekunden gemessen."],"Kig på støvlens yderside, på skaftet eller på sålen i hælen. Der står et tal, ofte efter":["Look at the outside of the boot, on the shaft or on the sole at the heel. There is a number, often after","Schau auf die Außenseite des Schuhs, am Schaft oder an der Sohle an der Ferse. Dort steht eine Zahl, oft nach"],"Print på A4-etiketark, 3 × 7 etiketter (63,5 × 38,1 mm). Vælg “Faktisk størrelse” / 100 %.":["Print on A4 label sheets, 3 × 7 labels (63.5 × 38.1 mm). Choose “Actual size” / 100%.","Auf A4-Etikettenbogen drucken, 3 × 7 Etiketten (63,5 × 38,1 mm). „Tatsächliche Größe“ / 100 % wählen."],"Pladsen frigives, og de på ventelisten får besked. Den første, der tager pladsen, får den.":["The spot is released and those on the waitlist are notified. The first to take it gets it.","Der Platz wird freigegeben und die Wartenden werden benachrichtigt. Wer ihn zuerst nimmt, bekommt ihn."],"Hent data, når du vil. Filerne åbner i Excel. Alt eksporteres også før sletning efter 90 dage.":["Download data whenever you like. The files open in Excel. Everything is a idden so you don’t change anything by accident. Personal data are examples.","Alle Seiten des Teilnehmers. Schaltflächen sind ausgeblendet, damit du nichts versehentlich änderst. Persönliche Daten sind Beispiele."],"Rækkerne ovenfor bliver sprunget over. De øvrige importeres. Ret de sprungne rækker i Excel, og importér dem bagefter.":["The rows above are skipped. The rest are imported. Fix the skipped rows in Excel and import them afterwards.","Die obigen Zeilen werden übersprungen. Die übrigen werden importiert. Korrigiere die übersprungenen Zeilen in Excel und importiere sie danach."],"Kig på bindingen. Der er en lille skala foran (tåen) og bagved (hælen). Tallet, som den lille markør peger på, er Z-værdien, fx":["Look at the binding. There is a small scale at the front (toe) and at the back (heel). The number the small marker points to is the DIN setting, e.g.","Schau auf die Bindung. Vorne (Zehe) und hinten (Ferse) ist eine kleine Skala. Die Zahl, auf die der kleine Pfeil zeigt, ist der Z-Wert, z. B."],"Ingen bruger har den e-mail, så der er ikke sendt en kode. (Den rigtige app viser det samme, så ingen kan se, hvem der er oprettet.)":["No user has that email, so no code was sent. (The real app shows the same, so nobody can see who has an account.)","Kein Benutzer hat diese E-Mail, daher wurde kein Code gesendet. (Die echte App zeigt dasselbe, damit niemand sehen kann, wer ein Konto hat.)"],"Hver ski har et unikt ID, og QR-koden indeholder det. ID’et står også med tal under koden, så det kan tastes ind, hvis koden er slidt.":["Each ski has a unique ID and the QR code contains it. The ID is also printed as digits under the code so it can be typed in if the code is worn.","Jeder Ski hat eine eindeutige ID, und der QR-Code enthält sie. Die ID steht auch als Zahl unter dem Code, damit sie eingegeben werden kann, falls der Code abgenutzt ist."],"Først til mølle.":["First come, first served.","Wer zuerst kommt, mahlt zuerst."],"QR: for lang tekst":["QR: text too long"
