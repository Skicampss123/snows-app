<!DOCTYPE html>
<html lang="da"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snow’s Sölden – prototype</title>
<style>
:root{--bg:#EEF3F7;--card:#fff;--ink:#0B2A43;--mut:#4A6378;--acc:#D9441F;--onacc:#fff;--line:#C5D3DE;--ok:#1E7B4A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1B2A;--card:#132D43;--ink:#F2F7FB;--mut:#A9BFD0;--acc:#FF6A3D;--onacc:#0A1B2A;--line:#2C4A63;--ok:#5FD08F;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:20px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--ink);color:var(--bg)}
header b{font-size:24px;letter-spacing:.5px}
.help{background:var(--acc);color:var(--onacc);border:0;border-radius:24px;font:700 18px inherit;padding:10px 18px;min-height:48px}
main{flex:1;overflow:auto;padding:16px}
h2{font-size:28px;margin:4px 0 14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:22px}
.mut{color:var(--mut);font-size:18px}
.btn{display:block;width:100%;min-height:60px;border:0;border-radius:14px;background:var(--acc);color:var(--onacc);font:700 22px system-ui;margin:10px 0 0}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.ok{background:var(--ok);color:#fff}
input,select{width:100%;box-sizing:border-box;min-height:56px;font:20px system-ui;padding:8px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);margin:6px 0}
nav{display:flex;border-top:2px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 16px system-ui;padding:10px 2px;min-height:64px}
nav button.on{color:var(--acc);font-weight:800}
nav span{display:block;font-size:26px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:2px solid var(--ink);background:none;color:var(--ink);border-radius:30px;padding:10px 18px;font:700 18px system-ui;min-height:48px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.tile{text-align:left;border:2px solid var(--ink);background:none;color:var(--ink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:110px;font:inherit}.tile .ti{font-size:28px}.tile small{opacity:.7;font-size:15px}.bar{height:10px;border-radius:6px;background:rgba(128,128,128,.3);margin:8px 0 12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}.ck{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:600 18px system-ui;padding:10px 0;min-height:48px}
.langpick{position:fixed;right:12px;bottom:12px;z-index:5}.langpick label{display:flex;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--ink);border-radius:30px;padding:4px 10px;color:var(--ink)}.langpick select{border:0;background:none;color:var(--ink);font:700 16px system-ui;min-height:40px}
.chip.on{background:var(--ink);color:var(--bg)}
.stars button{background:none;border:0;font-size:44px;color:var(--acc);padding:0 4px}
.tag{display:inline-block;padding:4px 12px;border-radius:20px;font-size:16px;font-weight:700;background:var(--ok);color:#fff}
.tag.w{background:var(--acc);color:var(--onacc)}
.off{background:var(--acc);color:var(--onacc);text-align:center;font-weight:700;padding:6px;font-size:16px}
.heart{float:right;border:0;background:none;font-size:34px;color:var(--acc)}
.big{font-size:40px;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;padding:20px;z-index:9}
.modal .card{width:100%;margin:0}
#app{display:flex;flex-direction:column;flex:1;min-height:0}
main,.modal .card{zoom:var(--fz,1)}
.sup{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#5B2A86;color:#fff;padding:8px 12px;font-size:16px;flex-wrap:wrap}
.sup select{width:auto;min-height:44px;margin:0;font-size:16px}
.sup .chip{color:#fff;border-color:#fff;min-height:44px;padding:6px 14px;font-size:16px}
.ro .btn,.ro .heart{display:none}
</style></head><body>

const t=k=>((TL[S.lang]||{})[k])||T[k]||k;
function setLang(l){S.lang=l;document.documentElement.lang=l;render()}
function langPick(){return `<div class="langpick"><label><span aria-hidden="true">🌐</span><select aria-label="${t("lang")}" onchange="setLang(this.value)">${Object.keys(LANGN).map(k=>`<option value="${k}" ${S.lang==k?"selected":""}>${LANGN[k]}</option>`).join("")}</select></label></div>`}
function langChips(){return `<div class="mut" style="margin-top:14px">${t("lang")}</div><div class="chips">${Object.keys(LANGN).map(k=>`<button class="chip ${S.lang==k?"on":""}" onclick="setLang('${k}')">${LANGN[k]}</button>`).join("")}</div>`}

const SK="snows_session";
function saveSess(){try{if(S.user&&S.camp&&!S.sup&&S.role!="Platform"){localStorage.setItem(SK,JSON.stringify({camp:S.camp,role:S.role,who:S.who,shop:S.shop,prof:S.prof,lang:S.lang,skipped:S.skipped}))}else if(!S.user){localStorage.removeItem(SK)}}catch(e){}}
function loadSess(){try{const d=JSON.parse(localStorage.getItem(SK)||"null");if(!d||!d.camp||!d.role)return;S.camp=d.camp;S.role=d.role;if(d.who)S.who=d.who;if(d.shop)S.shop=d.shop;if(d.prof)S.prof=d.prof;if(d.lang)S.lang=d.lang;S.skipped=!!d.skipped;S.user=1;S.setup=d.role=="Deltager"&&(!S.prof.boot||!S.prof.z)&&!S.skipped;S.tab=""}catch(e){}}
function render(){saveSess();
 const a=$("#app");
 if(!S.user){a.innerHTML=`<main>${authView()}<div style="height:72px"></div></main>${langPick()}`;return}
 if(!S.camp&&S.role!="Platform"){S.user=null;S.auth="login";a.innerHTML=`<main>${authView()}<div style="height:72px"></div></main>${langPick()}`;return}
 if(S.setup&&S.role=="Deltager"){a.innerHTML=`<header><b>${S.camp}</b></header><main>${setupView()}</main>${modal()}`;return}
 const tabs=S.role=="Deltager"?[["home","🏠",t("home")],["skis","⛷️",t("skis")],["ws","📅",t("ws")],["week","📋",t("week")],["info","ℹ️",t("info")]]:
  S.role=="Skiforretning"?[["shop","✅","Aflevering"],["myski","⛷️","Mine ski"],["newski","🏷️","Opret ski"],["dash","📊",t("dash")],["team","👥","Team"]]:S.role=="Instruktør"?[["inst","👥",t("instr")],["iprog","📋","Program"]]:S.role=="Platform"?[["plat","🛠️","Platform"]]:[["adm","⚙️","Oversigt"],["prev","👁️","Deltager-visning"]];
 if(!tabs.find(x=>x[0]==S.tab))S.tab=tabs[0][0];
 a.innerHTML=`${S.online?(S.syncing?`<div class="off">Sender dine valg …</div>`:""):`<div class="off">${t("offline")}</div>`}${S.sup?supBar():demoBar()}<header><b>${S.camp||"Platform"}</b>${S.role!="Deltager"&&S.role!="Platform"&&!S.sup?`<button class="help" onclick="logout()">Log ud</button>`:""}</header>
 <main>${view()}</main><nav>${tabs.map(x=>`<button class="${S.tab==x[0]?"on":""}" onclick="S.tab='${x[0]}';render()"><span>${x[1]}</span>${x[2]}</button>`).join("")}</nav>${modal()}`;
}
function skiCard(k,i){const st=k.st=="ude"?`<span class="tag w">${t("onNow")}</span>`:S.pending.includes(k.id)?`<span class="tag w">${t("waitShop")}</span>`:`<span class="tag">✓</span>`;
 return `<div class="card"><h3>${k.b} ${k.m}</h3><div class="mut">${k.l} cm · radius ${k.rad||"–"} m · ${k.w||"–"} mm · ${k.id}</div><div style="margin:8px 0">${st}${k.pend?" "+pendTag():""}</div>${k.st=="ude"&&retOf(k)?`<div class="mut">Skal være tilbage kl. ${retOf(k)}</div>`:""}
 ${k.st=="ude"&&!S.pending.includes(k.id)?`<button class="btn alt" onclick="handIn('${k.id}')">${t("handIn")}</button>`:""}
 ${k.st=="ind"?(k.r?`<div class="big" style="color:var(--acc)">${"★".repeat(k.r)}${"☆".repeat(5-k.r)}</div>`:`<button class="btn" onclick="S.modal=${i};render()">★ ${t("rate")}</button>`):""}</div>`}
function view(){
 if(S.tab=="home"){const on=S.ski.filter(k=>k.st=="ude");return `${offerBanner()}${retBanner()}${S.ski.map((k,i)=>[k,i]).filter(x=>x[0].st=="ind"&&!x[0].r).map(x=>`<div class="card" style="border-color:var(--acc)"><b>${t("rateRem")} ${x[0].b} ${x[0].m}</b><button class="btn" onclick="S.modal=${x[1]};render()">★ ${t("rate")}</button></div>`).join("")}${S.news.map(n=>`<div class="card"><span class="tag">Nyhed</span><h3>${n.t}</h3><div class="mut">${n.x}</div><div class="mut">${n.d}</div></div>`).join("")}${(!S.prof.boot||!S.prof.z)?`<div class="card" style="border-color:var(--acc)"><b>Udfyld dit udstyr</b><div class="mut">${[!S.prof.boot?"Støvlelængde":"",!S.prof.z?"Z-værdi":""].filter(Boolean).join(" og ")} mangler stadig.</div><button class="btn" onclick="S.setup=true;render()">Udfyld nu</button></div>`:""}<h2>Hej ${S.prof.name.split(" ")[0]}!</h2>
 <button class="btn" onclick="scan()">📷 ${t("scan")}</button>

function savePe(i){const n=$("#pe_n").value.trim(),e=$("#pe_e").value.trim(),b=$("#pe_b").value.trim().replace(",","."),z=$("#pe_z").value.trim().replace(",",".");if(n.length<2){toast("Skriv et navn.");return}if(!/^\S+@\S+\.\S+$/.test(e)){toast("Skriv en gyldig e-mail.");return}if(emailTaken(e,i<0?S.prof.e:S.parts[i].e)){toast("Den e-mail bruges allerede af en anden konto.");return}if(b&&!(+b>=200&&+b<=380)){toast("Støvlelængden skal være mellem 200 og 380 mm.");return}if(z&&!(+z>=1&&+z<=14)){toast("Z-værdien skal være mellem 1 og 14.");return}const old=i<0?S.prof.name:S.parts[i].n;if(i<0){S.prof.name=n;S.prof.e=e;S.prof.boot=b;S.prof.z=z}else S.parts[i]={n,e,b,z};if(old!=n){S.skilist.forEach(x=>{if(x.by==old)x.by=n});S.ws.forEach(w=>{["ro","wait"].forEach(k=>{if(w[k])w[k]=w[k].map(x=>x==old?n:x)})})}S.modal={mg:"Brugere"};toast("Deltageren er rettet ✓")}

 if(k=="lv"){if(!a){toast("Skriv et navn.");return}if(S.lvls.some(l=>l.toLowerCase()==a.toLowerCase())){toast("Niveauet findes allerede.");return}S.lvls.push(a);toast("Niveau tilføjet ✓")}

function paxStat(w){const l=(w.pax||[]).filter(p=>p.st!="no"),c=l.filter(p=>p.st=="in").length;return {l,c,m:l.length-c}}
function holdCard(w,i,compact){const q=paxStat(w),tag=!q.l.length?`<span class="tag w">Ingen deltagerliste</span>`:q.m==0?`<span class="tag">✓ Alle tjekket ind</span>`:`<span class="tag w">${q.m} mangler</span>`;return `<div class="card"><div class="row" style="align-items:flex-start"><div><b style="font-size:22px">${w.tm.split(" ")[1]}–${endT(w)}</b>${compact?`<div class="mut">${DN[w.tm.split(" ")[0]]}</div>`:""}</div>${tag}</div><h3 style="margin:6px 0">${w.t}</h3><div class="mut">📍 ${w.mp||"Se programmet"} · ${w.n} af ${w.max} pladser</div>${q.l.length?`<div class="bar" style="margin:10px 0 4px"><i style="width:${q.c/q.l.length*100}%;background:var(--ok)"></i></div><div class="mut">${q.c} af ${q.l.length} tjekket ind</div>`:""}<button class="btn" style="margin-top:10px" onclick="S.ihold=${i};S.ihf='alle';window.scrollTo(0,0);render()">Åbn hold</button></div>`}
function holdDetail(i){const w=S.ws[i],q=paxStat(w),o=w.offer,wl=waiters(w),f=S.ihf||"alle",all=w.pax||[],list=all.map((p,k)=>[p,k]).filter(x=>f=="alle"||(f=="mangler"&&!x[0].st)||(f=="ind"&&x[0].st=="in")||(f=="no"&&x[0].st=="no"));
 const ch=(k,l,n)=>`<button class="chip ${f==k?"on":""}" onclick="S.ihf='${k}';render()">${l} (${n})</button>`;
 return `<button class="chip" onclick="S.ihold=null;render()">← Mine hold</button><h2 style="margin-top:12px">${w.t}</h2><div class="mut">${DN[w.tm.split(" ")[0]]} ${w.tm.split(" ")[1]}–${endT(w)} · 📍 ${w.mp||"Se programmet"}</div><div class="card" style="margin-top:12px"><b>${q.c} af ${q.l.length} tjekket ind</b><div class="bar" style="margin:8px 0"><i style="width:${q.l.length?q.c/q.l.length*100:0}%;background:var(--ok)"></i></div>${q.m>0?`<button class="btn" onclick="checkAll(${i})">Tjek alle ind (${q.m})</button>`:q.l.length?`<span class="tag">✓ Alle er tjekket ind</span>`:`<div class="mut">Ingen deltagere endnu.</div>`}</div>${all.length?`<div class="chips">${ch("alle","Alle",all.length)}${ch("mangler","Mangler",all.filter(p=>!p.st).length)}${ch("ind","Ind",q.c)}${ch("no","Udeblev",all.filter(p=>p.st=="no").length)}</div>`:""}${list.map(x=>{const p=x[0],k=x[1];return `<div class="card" style="padding:12px"><div class="row" style="flex-wrap:wrap"><b style="font-size:19px">${p.n}</b>${p.st=="in"?`<span class="tag">✓ Ind</span>`:p.st=="no"?`<span class="tag w">Mødte ikke op</span>`:""}</div><div class="row" style="justify-content:flex-start;margin-top:8px;flex-wrap:wrap">${p.st=="in"?`<button class="chip" onclick="S.ws[${i}].pax[${k}].st='';render()">Fortryd</button>`:p.st=="no"?"":`<button class="chip on" style="min-height:48px;padding:0 20px" onclick="S.ws[${i}].pax[${k}].st='in';render()">${t("checkin")}</button><button class="chip" onclick="S.modal={ns:${k},w:${i}};render()">Mødte ikke op</button>`}</div></div>`}).join("")}${all.length&&!list.length?`<div class="mut">Ingen i denne visning.</div>`:""}${o&&(o.seats>0||o.claimedBy)?`<div class="card"><b>Ledig plads</b><div class="mut">${o.claimedBy?`Pladsen er taget af ${o.claimedBy}.`:`Besked sendt til ${wl.length} på ventelisten. Først til mølle.`}</div></div>`:""}<div class="card"><b>Venteliste</b><div class="mut">${wl.length?wl.join(", "):"Ingen"}</div></div>`}
function instProg(){const it=[...S.prog.map(p=>({d:p.d,tm:p.tm,t:p.t,pl:p.pl,k:"Program"})),...S.ws.filter(w=>!w.gone).map(w=>({d:w.tm.split(" ")[0],tm:w.tm.split(" ")[1],t:w.t,pl:w.lv+" · "+w.n+"/"+w.max+" tilmeldt",k:w.ins==S.who?"Dit hold":"Workshop"}))];return `<h2>Ugens program</h2>`+pdfCard()+DAYS.filter(d=>it.some(i=>i.d==d)).map(d=>`<h2>${DN[d]}</h2>`+it.filter(i=>i.d==d).sort((a,b)=>a.tm.localeCompare(b.tm)).map(i=>`<div class="card"><h3>${i.tm} ${i.t}</h3><div class="mut">${i.pl}</div>${i.k=="Dit hold"?`<span class="tag w">Dit hold</span>`:i.k=="Workshop"?`<span class="mut">Workshop</span>`:""}</div>`).join("")).join("")}
function doNs(){const w=S.ws[S.modal.w];w.pax[S.modal.ns].st="no";w.n--;w.offer=w.offer||{seats:0};w.offer.seats++;w.offer.claimedBy=null;S.modal=null;const n=waiters(w).length;toast(n?"Plads frigivet. Besked sendt til "+n+" på ventelisten.":"Plads frigivet. Ingen på ventelisten.")}
function offerBanner(){return S.ws.filter(w=>w.en==2&&w.offer).map(w=>w.offer.seats<(w.gs||1)?`<div class="card"><h3>Pladsen blev taget</h3><div class="mut">${w.t}: du står stadig på ventelisten.</div></div>`:`<div class="card" style="border-color:var(--acc)"><h3>Der er en ledig plads!</h3><div class="mut">${w.t} · ${w.tm}<br>Mød op: ${w.mp||"Se programmet"}</div><button class="btn" onclick="claim(${S.ws.indexOf(w)})">Tag pladsen</button><div class="mut" style="margin-top:8px">Først til mølle.</div></div>`).join("")}
function claim(i){if(!S.online){toast("Ingen net. Pladsen kan kun tages med dækning. Prøv igen.");return}const w=S.ws[i],need=w.gs||1;if(!w.offer||w.offer.seats<need){toast("Pladsen er desværre taget. Du står stadig på ventelisten.");return}w.offer.seats-=need;w.offer.claimedBy=S.prof.name;w.en=1;w.n+=need;toast("Du har fået pladsen! Mød op: "+(w.mp||"se programmet"))}
function demoBar(){return `<div class="sup" style="background:#3a3a3a"><span>Demo: se som</span><select onchange="S.role=this.value;S.tab='';render()">${[...ROLES,"Platform"].map(r=>`<option ${r==S.role?"selected":""}>${r}</option>`).join("")}</select>${S.role=="Skiforretning"?`<select onchange="S.shop=this.value;render()">${S.shops.map(x=>`<option ${x.n==S.shop?"selected":""}>${x.n}</option>`).join("")}</select>`:""}${S.role=="Instruktør"?`<select onchange="S.who=this.value;render()">${S.instr.map(x=>`<option ${x.n==S.who?"selected":""}>${x.n}</option>`).join("")}</select><select onchange="const v=this.value.split(' ');S.now={d:v[0],tm:v[1]};render()">${["Man 08:30","Man 09:30","Tirs 08:30","Ons 08:30"].map(x=>`<option value="${x}" ${x==S.now.d+" "+S.now.tm?"selected":""}>Tid: ${x}</option>`).join("")}</select>`:""}</div>`}
const WROWS=[{t:"Carving for begyndere",lv:"Nybegynder",tm:"Tors 09:00",max:10,ins:"Mette Bro",sk:"Rossignol Experience 78"},{t:"Offpiste intro",lv:"Erfaren",tm:"Tors 13:00",max:8,ins:"Anders Berg",sk:"Head Kore 93"},{t:"Teknik og balance",lv:"Øvet",tm:"Fre 10:00",max:10,ins:"Anders Berg",sk:"Atomic Maverick 86"}];
function holdImportCard(){return `<div class="card"><h3>Importér hold fra fil</h3><div class="mut">Excel. Kolonner: Navn, Niveau, Dag, Tid, Varighed, Max, Instruktør, Anbefalet ski</div><button class="btn alt" onclick="getTpl('hold')">Hent Excel-skabelon</button><input id="wf" type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="pickWs()"><button class="btn" onclick="document.getElementById('wf').click()">Vælg Excel-fil</button></div>${S.wimp?wimpView():""}`}
function wimpView(){return impList(S.wimp,r=>`<div style="margin:10px 0"><b>✓ ${r.t}</b><div class="mut">${r.tm} · ${r.lv} · ${r.ins}</div></div>`,"wimpOk()","S.wimp=null;render()","hold")}
async function pickWs(){const inp=document.getElementById('wf'),f=inp.files[0];const rows=await readSheetFile(f);inp.value="";if(!rows)return;const spec={t:["navn","hold","titel"],lv:["niveau","level"],d:["dag","day"],tm:["tid","time","tidspunkt"],du:["varighed","varighedminutter","minutter"],mx:["max","maks","maxdeltagere","pladser"],ins:["instruktør","instruktor","instructor"],sk:["anbefaletski","ski"]};const res=parseImport(rows,spec,["t","lv","d","tm","ins"],"",(r,g,ok)=>{const t=g(r,"t"),lv=lvOf(g(r,"lv")),d=dayOf(g(r,"d")),tm=timeNorm(g(r,"tm")),du=g(r,"du")?numOf(g(r,"du"),30,480):120,mx=g(r,"mx")?numOf(g(r,"mx"),1,200):10,insN=g(r,"ins"),ins=S.instr.find(x=>nrm(x.n)==nrm(insN));if(!t)return {err:"Navn mangler."};if(!lv)return {err:"Niveauet skal være et af: "+S.lvls.slice(1).join(", ")+".",label:t};if(!d)return {err:"Dagen skal være fx Man eller Mandag.",label:t};if(!tm)return {err:"Tiden skal være fx 10:00.",label:t};if(du==null)return {err:"Varigheden skal være 30–480 minutter.",label:t};if(mx==null)return {err:"Max skal være et tal mellem 1 og 200.",label:t};if(!ins)return {err:"Instruktøren \""+insN+"\" findes ikke. Opret instruktøren først, og vælg filen igen.",label:t};const full=d+" "+tm,st=DAYS.indexOf(d)*1440+hm(tm),cl=[...S.ws.filter(w=>!w.gone).map(w=>({ins:w.ins,s:absT(w),e:absT(w)+(w.dur||120),t:w.t})),...ok.map(w=>({ins:w.ins,s:DAYS.indexOf(w.tm.split(" ")[0])*1440+hm(w.tm.split(" ")[1]),e:DAYS.indexOf(w.tm.split(" ")[0])*1440+hm(w.tm.split(" ")[1])+w.dur,t:w.t}))].find(x=>x.ins==ins.n&&st<x.e&&x.s<st+du);if(cl)return {err:ins.n+" har allerede \""+cl.t+"\" på det tidspunkt.",label:t};return {row:{t,lv,tm:full,dur:du,max:mx,ins:ins.n,sk:g(r,"sk")}}});S.wimp={name:f.name,...res};render()}
function wimpOk(){const k=S.wimp.errs.length,n=S.wimp.ok.length;S.wimp.ok.forEach(r=>S.ws.push({id:S.ws.length+1,t:r.t,lv:r.lv,tm:r.tm,sk:r.sk,dur:r.dur,max:r.max,n:0,en:0,fav:0,ins:r.ins,pax:[],wait:[],ro:[],mp:"Se programmet"}));S.wimp=null;toast(n+" hold oprettet ✓"+(k?" ("+k+" sprunget over)":""))}
function setupView(){const d=S.draft||{},ub=S.unkB,uz=S.unkZ;return `<h2>${t("setupH")}</h2><div class="mut">${t("setupP")}</div>${S.skipped?`<div class="card" style="border-color:var(--acc)"><b>Påmindelse</b><div class="mut">Du sprang noget over sidst. Udfyld det nu, så butikkerne kan vælge de rigtige ski til dig.</div></div>`:""}<div style="margin-top:14px"><b>${t("bootLbl")}</b></div><div class="row"><button class="chip" aria-label="Vejledning til støvlestørrelse" onclick="openHelp('hb')">${t("howRead")}</button><button class="chip ${ub?"on":""}" onclick="togUnk('b')">${ub?"✓ ":""}${t("unknown")}</button></div><input id="ob_b" inputmode="numeric" placeholder="${ub?t("later"):t("eg")+" 295"}" ${ub?"disabled":""} value="${ub?"":(d.b!=null?d.b:S.prof.boot)}"><div style="margin-top:14px"><b>${t("z")}</b></div><div class="row"><button class="chip" aria-label="Vejledning til Z-værdi" onclick="openHelp('hz')">${t("howRead")}</button><button class="chip ${uz?"on":""}" onclick="togUnk('z')">${uz?"✓ ":""}${t("unknown")}</button></div><input id="ob_z" inputmode="decimal" placeholder="${uz?t("later"):t("eg")+" 7.5"}" ${uz?"disabled":""} value="${uz?"":(d.z!=null?d.z:S.prof.z)}">${S.oerr?`<div class="mut" style="color:var(--acc);margin-top:10px">${S.oerr}</div>`:""}<button class="btn" onclick="saveSetup()">${t("saveGo")}</button>`}
function togUnk(k){S.draft={b:$("#ob_b").value,z:$("#ob_z").value};if(k=="b")S.unkB=!S.unkB;else S.unkZ=!S.unkZ;S.oerr="";render()}
function openHelp(k){S.draft={b:$("#ob_b")?$("#ob_b").value:"",z:$("#ob_z")?$("#ob_z").value:""};S.modal=k;render()}
function closeHelp(){S.modal=null;render()}
function skipSetup(){S.setup=false;S.skipped=true;S.oerr="";S.draft=null;render()}
function saveSetup(){const b=$("#ob_b").value.trim().replace(",","."),z=$("#ob_z").value.trim().replace(",",".");if(!S.unkB&&!(+b>=200&&+b<=380)){S.draft={b:$("#ob_b").value,z:$("#ob_z").value};S.oerr="Skriv støvlelængden i millimeter, fx 295, eller tryk “Ved ikke endnu”.";render();return}if(!S.unkZ&&!(+z>=1&&+z<=14)){S.draft={b:$("#ob_b").value,z:$("#ob_z").value};S.oerr="Skriv din Z-værdi som et tal, fx 7,5, eller tryk “Ved ikke endnu”.";render();return}S.prof.boot=S.unkB?"":b;S.prof.z=S.unkZ?"":z;S.skipped=!!(S.unkB||S.unkZ);S.unkB=S.unkZ=false;S.setup=false;S.draft=null;S.oerr="";render()}
function enrBtn(w){const p=w.tm.split(" "),di=DAYS.indexOf(p[0]),ni=DAYS.indexOf(S.now.d),m=x=>{const a=x.split(":");return +a[0]*60+ +a[1]},nm=m(S.now.tm);if(di<ni||(di==ni&&nm>m(p[1])-10))return `<div class="mut" style="margin-top:8px">Tilmelding er lukket</div>`;if(di>ni||nm<480)return `<div class="mut" style="margin-top:8px">🔒 Tilmelding åbner ${DN[p[0]].toLowerCase()} kl. 08:00</div>`;const c=clash(w);if(c)return `<div class="mut" style="margin-top:8px">Du er allerede tilmeldt "${c.t}" på samme tidspunkt.</div>`;return `<button class="btn" onclick="openGrp(${w.id-1})">${w.n>=w.max?t("full"):t("enroll")}</button>`}
function openGrp(i){S.grp=[];S.gerr="";S.modal={g:i};render()}
function grpGo(){const i=S.modal.g,w=S.ws[i],names=S.grp.map(x=>x.trim()).filter(Boolean),sz=1+names.length,v=w.n+sz>w.max?2:1;w.gn=names;S.modal=null;enr(i,v,sz);if(sz>1)w.code="GRP-"+Math.floor(1000+Math.random()*9000);if(v==2)toast("Holdet har ikke plads til hele gruppen. I er sat på venteliste.");else render()}
function joinCode(){const i=S.modal.g,w=S.ws[i],c=$("#gc").value.trim().toUpperCase();if(!c||c!=w.code){S.gerr="Koden passer ikke til dette hold.";render();return}S.modal=null;enr(i,w.n+1>w.max?2:1,1)}
function togSki(i){const s=S.skilist[i];if(s.st=="ude"){done(s.id);return}if(s.bad){toast("Skien er markeret som "+s.bad.toLowerCase()+". Fjern markeringen først.");return}s.st="ude";render()}
function setBad(i,k){const s=S.skilist[i],n=($("#bd_n")||{value:""}).value.trim();if(k){s.bad=k;s.badNote=n;S.badLog.unshift({id:s.id,m:s.br+" "+s.m,k,n,d:S.now.d+" "+S.now.tm});toast("Skien er markeret som "+k.toLowerCase()+". Arrangøren kan se det.")}else{s.bad=null;s.badNote="";S.badLog.unshift({id:s.id,m:s.br+" "+s.m,k:"Klar igen",n:"",d:S.now.d+" "+S.now.tm});toast("Skien er klar til udlån igen ✓")}S.modal=null;render()}
function logCard(){return `<div class="card"><h3>Support-adgang</h3>${S.log.length?S.log.map(l=>`<div class="mut">${l.t} · Platformen åbnede campen som ${l.r}</div>`).join(""):`<div class="mut">Platformen har ikke åbnet jeres camp.</div>`}</div>`}
const SFR={l:["Længde",[["0","Under 160 cm",0,160],["1","160–169 cm",160,170],["2","170–179 cm",170,180],["3","180 cm og op",180,999]]],r:["Radius",[["0","Under 14 m",0,14],["1","14–16 m",14,17],["2","17 m og op",17,99]]],b:["Bredde under ski",[["0","Under 80 mm",0,80],["1","80–89 mm",80,90],["2","90 mm og op",90,999]]]};
function skiMatch(x){const F=S.sf,f={l:+x.l,r:+x.r,b:+x.b};for(const k in SFR){if(!F[k])continue;const o=SFR[k][1].find(o=>o[0]==F[k]);if(o&&!(f[k]>=o[2]&&f[k]<o[3]))return false}if(F.lv&&x.lv!=F.lv)return false;return true}
function skiFilters(){const F=S.sf,sel=k=>`<label class="mut" style="display:block">${SFR[k][0]}<select onchange="setSf('${k}',this.value)" style="width:100%;margin-top:4px"><option value="">Alle</option>${SFR[k][1].map(o=>`<option value="${o[0]}" ${F[k]==o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></label>`;return `<div class="card"><b>Filtre</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">${sel("l")}${sel("r")}${sel("b")}<label class="mut" style="display:block">Niveau<select onchange="setSf('lv',this.value)" style="width:100%;margin-top:4px"><option value="">Alle</option>${S.lvls.slice(1).map(l=>`<option ${F.lv==l?"selected":""}>${l}</option>`).join("")}</select></label></div>${Object.values(F).some(Boolean)?`<button class="chip" style="margin-top:10px" onclick="resetSf()">Nulstil filtre</button>`:""}</div>`}
function setSf(k,v){S.sf[k]=v;render()}
function resetSf(){S.sf={l:"",r:"",b:"",lv:""};render()}
function skisView(){const k=S.skv||"mine";const head=`<div class="chips">${[["mine","Mine ski"],["free","Ledige ski"]].map(x=>`<button class="chip ${k==x[0]?"on":""}" onclick="S.skv='${x[0]}';render()">${x[1]}</button>`).join("")}</div>`;if(k=="mine")return `<h2>${t("tried")}</h2>${head}${S.ski.length?S.ski.map(skiCard).join(""):`<div class="card"><h3>Ingen ski endnu</h3><div class="mut">Scan QR-koden på en ski for at komme i gang.</div><button class="btn" onclick="scan()">📷 Scan ski</button></div>`}`;const all=S.skilist.filter(s=>s.st!="ude"&&!s.gone&&!s.bad),F=S.sf,fr=all.filter(skiMatch),act=Object.values(F).some(Boolean);return `<h2>Ledige ski</h2>${head}${skiFilters()}<div class="mut" style="margin-bottom:10px">${act?fr.length+" af "+all.length+" ledige ski matcher":all.length+" ski er ledige lige nu"}</div>${all.length?(fr.length?"":`<div class="card"><h3>Ingen ski matcher</h3><div class="mut">Prøv at ændre eller nulstille filtrene.</div><button class="btn alt" onclick="resetSf()">Nulstil filtre</button></div>`):`<div class="card"><h3>Ingen ledige ski lige nu</h3><div class="mut">Prøv igen om lidt. Butikkerne opdaterer løbende.</div></div>`}${[...new Set(fr.map(s=>s.br))].sort().map(br=>`<h2 style="margin-top:18px">${br} (${fr.filter(s=>s.br==br).length})</h2>${fr.filter(s=>s.br==br).map(s=>`<div class="card"><h3>${s.m}</h3><div class="mut">${s.l} cm · radius ${s.r} m · ${s.b} mm · anbefalet: ${s.lv}</div><div style="margin-top:8px"><span class="tag">Ledig</span></div></div>`).join("")}`).join("")}`}
function done(id){S.pending=S.pending.filter(x=>x!=id);const k=S.ski.find(x=>x.id==id);if(k)k.st="ind";const s=S.skilist.find(x=>x.id==id);if(s){s.st="inde";s.by=""}render()}
function toast(m){S.toast=m;render()}
loadSess();render();
</script></body></html>
